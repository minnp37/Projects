name: "OCPP Virtual Charger"
description: "Virtual OCPP 1.6 car charger for Charger Management Systems Backend. Mimics a generic OCPP charger and lets Home Assistant set the power and lifetime energy it reports."
version: "1.31"
slug: "ocpp_virtual_charger"
url: "https://github.com/minnp37/Projects/tree/main/ocpp_virtual_charger"
arch:
  - aarch64
  - amd64
  - armv7
init: false
ingress: true
panel_icon: "mdi:ev-station"
panel_title: "Virtual Car Charger"
services:
  - mqtt:need

options:
  charger:
    server_url: null
    chargepoint_id: null
    password: null
    vendor: "Wall Box Chargers"
    model: "PLP1-0-2-2"
    chargepoint_serial_number: null
    chargebox_serial_number: null
    firmware_version: "6.7.43"
    meter_type: "Internal NON compliant"
    initial_meter_wh: 0          # starting lifetime register (Wh); only used when there is no saved state
    meter_wh_override: null      # one-time reset (Wh): applied once, then the saved state takes over again
    user_agent: "WebSocket++/0.8.2"
    default_id_tag: "ffffffffffffff7f"
  heartbeat_interval: 300
  meter_interval: 60
  clock_aligned_interval: 900
  ws_ping_interval: 50
  dummy_power_watts: 0
  energy_source: "integrate"     # integrate = energy accumulates from power; mqtt = energy only changes when you set it
  voltage_v: 226
  manual_stop_lockout_s: 60
  log_lines: 500
  log_raw_frames: true
  quirks:
    aligned_timestamp_lag: true
    boot_sample_energy_zero: false
    boot_on_reconnect: false
  timing:
    prepare_s: 1.5
    suspended_ev_s: 0.5
    start_transaction_s: 0.15
    charging_s: 6.0
  mqtt:
    host: "core-mosquitto"
    port: 1883
    username: null
    password: null
    ssl: false

schema:
  charger:
    server_url: "str?"
    chargepoint_id: "str?"
    password: "password?"
    vendor: "str?"
    model: "str?"
    chargepoint_serial_number: "str?"
    chargebox_serial_number: "str?"
    firmware_version: "str?"
    meter_type: str
    initial_meter_wh: "int?"
    meter_wh_override: "int?"
    user_agent: "str?"
    default_id_tag: "str?"
  heartbeat_interval: int
  meter_interval: int
  clock_aligned_interval: int
  ws_ping_interval: int
  dummy_power_watts: int
  energy_source: "list(integrate|mqtt)"
  voltage_v: int
  manual_stop_lockout_s: int
  log_lines: int
  log_raw_frames: bool
  quirks:
    aligned_timestamp_lag: bool
    boot_sample_energy_zero: bool
    boot_on_reconnect: bool
  timing:
    prepare_s: float
    suspended_ev_s: float
    start_transaction_s: float
    charging_s: float
  mqtt:
    host: "str?"
    port: int
    username: "str?"
    password: "password?"
    ssl: bool
